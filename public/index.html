<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#087d68">
<meta name="description" content="A personal WhatsApp AI assistant with smart replies, multi-account support, conversation memory, and a responsive dashboard.">
<title>WhatsApp AI Assistant</title>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/css/app.css">
<script>
  (function() {
    var token = localStorage.getItem('token');
    if (token) {
      window.location.replace('/dashboard.html');
    } else {
      window.location.replace('/login.html');
    }
  })();
</script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100dvh;margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg,#f4f7f6);color:var(--text,#14201d);">
  <div style="text-align:center;padding:20px;">
    <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#19c8a2,#087d68);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 8px 20px rgba(0,0,0,0.15);">
      <img src="/favicon.svg" alt="Logo" style="width:32px;height:32px;">
    </div>
    <div style="font-weight:700;font-size:18px;margin-bottom:6px;">WhatsApp AI Assistant</div>
    <div style="color:var(--muted,#6c7b76);font-size:13px;">Loading workspace…</div>
  </div>
</body>
</html>
