<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072e27"/>
      <stop offset="45%" stop-color="#051c18"/>
      <stop offset="100%" stop-color="#020d0b"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25d366"/>
      <stop offset="50%" stop-color="#0aa884"/>
      <stop offset="100%" stop-color="#075e54"/>
    </linearGradient>

    <!-- Metallic Gold Crown -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="35%" stop-color="#f5c842"/>
      <stop offset="70%" stop-color="#d99b16"/>
      <stop offset="100%" stop-color="#916200"/>
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base Squircle with Metallic Emerald Rim -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bgGrad)" stroke="#10b981" stroke-width="4" stroke-opacity="0.4" filter="url(#softShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#glassHighlight)"/>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="256" cy="256" r="140" fill="#0aa884" opacity="0.18" filter="url(#neonBlur)"/>

  <!-- WhatsApp Chat Bubble Contour -->
  <path d="M120 160 C120 120 152 88 192 88 L320 88 C360 88 392 120 392 160 L392 290 C392 330 360 362 320 362 L230 362 L150 416 L168 362 L160 362 C138 362 120 344 120 322 Z" 
        fill="none" stroke="url(#emeraldGlow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#neonBlur)"/>

  <!-- AI Robot Core Head -->
  <g filter="url(#softShadow)">
    <rect x="176" y="196" width="160" height="136" rx="44" fill="#ffffff" stroke="#a7f3d0" stroke-width="6"/>
    <!-- Glass Visor -->
    <rect x="194" y="214" width="124" height="100" rx="30" fill="#0c1e1a" stroke="#10b981" stroke-width="2"/>
    
    <!-- LED Glowing Eyes -->
    <circle cx="228" cy="258" r="13" fill="#25d366" filter="url(#neonBlur)"/>
    <circle cx="228" cy="258" r="5" fill="#ffffff"/>
    <circle cx="284" cy="258" r="13" fill="#25d366" filter="url(#neonBlur)"/>
    <circle cx="284" cy="258" r="5" fill="#ffffff"/>

    <!-- AI Smile Curve -->
    <path d="M236 288 Q256 304 276 288" fill="none" stroke="#25d366" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

    <!-- Robot Antenna Node -->
    <path d="M256 196 L256 166" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="256" cy="154" r="14" fill="#25d366" stroke="#ffffff" stroke-width="5" filter="url(#neonBlur)"/>
  </g>

  <!-- Luxury Royal Gold Crown -->
  <g filter="url(#softShadow)">
    <path d="M198 160 L180 114 L222 136 L256 94 L290 136 L332 114 L314 160 Z" 
          fill="url(#goldGrad)" stroke="#fff8d4" stroke-width="5" stroke-linejoin="round"/>
    <!-- Jewels on Crown Tips -->
    <circle cx="180" cy="114" r="7" fill="#ffffff" filter="url(#neonBlur)"/>
    <circle cx="256" cy="94" r="9" fill="#ffffff" filter="url(#neonBlur)"/>
    <circle cx="332" cy="114" r="7" fill="#ffffff" filter="url(#neonBlur)"/>
  </g>

  <!-- Mini WhatsApp Verified Badge -->
  <g transform="translate(325, 305)" filter="url(#neonBlur)">
    <circle cx="42" cy="42" r="38" fill="url(#emeraldGlow)" stroke="#ffffff" stroke-width="6"/>
    <path d="M28 42 L38 52 L58 32" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
