<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#087d68">
<meta name="description" content="Admin Control Center for AI Assistant and workspace automation.">
<title>Admin Console · AI Assistant</title>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/css/app.css">
<style>
.login-shell{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;position:relative;overflow:hidden}
.login-shell:before,.login-shell:after{content:"";position:absolute;border-radius:999px;filter:blur(2px);pointer-events:none}
.login-shell:before{width:420px;height:420px;background:rgba(10,168,137,.12);top:-180px;left:-120px}
.login-shell:after{width:360px;height:360px;background:rgba(8,125,105,.08);bottom:-170px;right:-120px}
.login-card{position:relative;z-index:1;width:min(440px,100%);padding:34px;border:1px solid var(--line);border-radius:26px;background:color-mix(in srgb,var(--surface) 95%,transparent);box-shadow:0 28px 80px rgba(16,38,52,.12);backdrop-filter:blur(18px)}
.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.login-logo{width:54px;height:54px;border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(8,125,105,.2);display:grid;place-items:center;background:linear-gradient(135deg,#19c8a2,#087d68)}
.login-logo img{width:34px;height:34px;display:block}
.login-brand strong{font-size:20px;letter-spacing:-.02em}.login-brand small{display:block;color:var(--muted);margin-top:2px;font-size:12px}
.login-title{margin:0 0 6px;font-size:26px;letter-spacing:-.03em}.login-sub{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.5}
.login-field{display:grid;gap:6px;margin-top:14px}.login-field label{margin:0;font-size:12px;font-weight:800;color:var(--muted)}
.login-input{min-height:46px!important;border-radius:12px!important;padding:10px 13px!important}
.login-password{position:relative}.login-password .login-input{padding-right:76px!important}
.login-toggle{position:absolute;right:7px;top:6px;width:60px!important;min-height:34px!important;margin:0!important;border:0!important;background:transparent!important;color:var(--brand-dark)!important;font-size:11px!important;font-weight:800!important;box-shadow:none!important}
.login-submit{width:100%;min-height:48px;margin-top:20px;border:0;border-radius:12px;background:linear-gradient(135deg,#12b996,#087d68);color:#fff;font-weight:800;box-shadow:0 12px 24px rgba(10,168,137,.2)}
.login-submit:hover{transform:translateY(-1px)}
.login-mode{width:100%;margin-top:10px!important;min-height:42px!important;border:1px solid var(--line)!important;background:var(--surface)!important;color:var(--text)!important;border-radius:12px!important}
.login-foot{text-align:center;color:var(--muted);font-size:11px;margin:18px 0 0}
#error{min-height:18px;color:#c63f47;font-size:12px;text-align:center;margin:10px 0 0}
.login-footer{position:relative;z-index:1;margin-top:24px;width:min(440px,100%);display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;align-items:center;color:var(--muted);font-size:12px;text-align:center}
.login-footer a{color:var(--brand);font-weight:700}
.login-footer a:hover{text-decoration:underline}
@media(max-width:480px){.login-shell{padding:14px}.login-card{padding:24px 18px;border-radius:20px}.login-title{font-size:23px}}
</style>
</head>
<body>
<main class="login-shell">
<section class="login-card" aria-labelledby="loginTitle">
<div class="login-brand">
  <div class="login-logo"><img src="/favicon.svg" alt="Workspace"></div>
  <div><strong>Control Center</strong><small>Admin Workspace Console</small></div>
</div>
<h1 class="login-title" id="loginTitle">Admin Access</h1>
<p class="login-sub">Sign in to manage your AI assistant, system automation and connected accounts.</p>
<form id="form" autocomplete="on">
<div class="login-field"><label for="username">Username</label><input class="login-input" id="username" name="admin_username" autocomplete="username" placeholder="Enter username" required autofocus></div>
<div class="login-field"><label for="password">Password</label><div class="login-password"><input class="login-input" id="password" name="admin_access_code" type="password" autocomplete="current-password" placeholder="Enter password" required><button class="login-toggle" id="togglePassword" type="button">Show</button></div></div>
<button class="login-submit" id="loginBtn" type="submit">Sign In to Dashboard</button>
</form>
<p id="error" role="alert" aria-live="polite"></p>
<button class="login-mode" id="mode" type="button">🌙  Switch to dark mode</button>
<p class="login-foot">Self-Hosted Admin Console · Protected Session</p>
</section>
<footer class="login-footer" aria-label="Developer information">
  <span>© <span data-current-year>2026</span> WhatsApp AI Bot</span>
  <span>Developed by <strong>Nitesh Kumar</strong></span>
  <a href="https://github.com/nitesh933438" target="_blank" rel="noopener noreferrer">GitHub</a>
  <a href="https://github.com/nitesh933438/WhatsApp-Personal-AI-Bot-Demo" target="_blank" rel="noopener noreferrer">Source Repo</a>
  <a href="https://www.linkedin.com/in/nitesh933438/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  <span data-app-version>v1.2.8</span>
</footer>
</main>
<script src="/js/footer.js" defer></script><script src="/js/login.js" defer></script>
</body>
</html>
